<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Fire Crystal Badges Preview</title>
<style>
  body { 
    background: #0f172a; 
    margin: 0; 
    padding: 40px; 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
    color: #fff;
  }
  .grid { 
    display: grid; 
    grid-template-columns: repeat(5, 1fr); 
    gap: 35px; 
    max-width: 1100px; 
    margin: 0 auto; 
  }
  .cell { 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    gap: 12px; 
    background: rgba(30, 41, 59, 0.6); 
    border: 1px solid rgba(255, 255, 255, 0.1); 
    padding: 24px 16px; 
    border-radius: 16px; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    transition: transform 0.2s;
  }
  .cell:hover {
    transform: translateY(-5px);
  }
  .label { 
    color: #94a3b8; 
    font-size: 14px; 
    font-weight: bold; 
    text-align: center; 
  }
  .badge-img {
    width: 140px;
    height: 140px;
    object-fit: contain;
    mix-blend-mode: screen;
    transition: transform 0.2s;
  }
  .badge-img:hover {
    transform: scale(1.1);
  }
  h1 { 
    text-align: center; 
    margin-bottom: 8px; 
    font-size: 32px; 
    font-weight: 800;
  }
  p.subtitle {
    text-align: center;
    color: #06b6d4;
    margin-bottom: 40px;
    font-size: 15px;
  }
</style>
</head>
<body>
<h1>🔥 Fire Crystal Badges (FC 1 - FC 10)</h1>
<p class="subtitle">3D Gem-Faceted Crystals • Seamless Transparent Screen Blend</p>

<div class="grid" id="grid"></div>

<script>
const glowMap = {
  1: 'rgba(239,68,68,0.9)',
  2: 'rgba(249,115,22,0.9)',
  3: 'rgba(234,179,8,0.9)',
  4: 'rgba(16,185,129,0.9)',
  5: 'rgba(6,182,212,0.9)',
  6: 'rgba(59,130,246,0.9)',
  7: 'rgba(139,92,246,0.9)',
  8: 'rgba(236,72,153,0.9)',
  9: 'rgba(132,204,22,1.0)',
  10: 'rgba(255,215,0,0.95)'
};

const names = [
  'Crimson Red',
  'Flame Orange',
  'Sunburst Yellow',
  'Emerald Green',
  'Ice Cyan',
  'Sapphire Blue',
  'Amethyst Purple',
  'Magenta Rose',
  'Kryptonite Lime',
  'Imperial Gold'
];

const grid = document.getElementById('grid');
for (let i = 1; i <= 10; i++) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  const glow = glowMap[i];
  cell.innerHTML = `
    <img src="/badges/fc${i}.jpg" class="badge-img" style="filter: drop-shadow(0 0 25px ${glow});">
    <div class="label">FC ${i}<br><span style="color:#fff;">${names[i-1]}</span></div>
  `;
  grid.appendChild(cell);
}
</script>
</body>
</html>
